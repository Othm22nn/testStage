# ==== Base de donnees SQL Server ====
# Adapte l'URL si tu utilises une instance nommee (ex: localhost\sqlexpress)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=SkyTraceDB;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# validate = ne modifie jamais tes tables existantes, verifie juste la correspondance
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ==== JWT ====
# Definir JWT_SECRET (au moins 32 octets) dans l'environnement local, jamais dans Git.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Origines autorisees, separees par des virgules.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

# ==== Serveur ====
server.port=${SERVER_PORT:8080}
