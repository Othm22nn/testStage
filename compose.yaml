name: skytrace
services:
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  app:
    build: ./app
    environment:
      DB_URL: "jdbc:sqlserver://db:1433;databaseName=SkyTraceDB;encrypt=true;trustServerCertificate=true"
      DB_USERNAME: skytrace
      DB_PASSWORD: ${DB_PASSWORD:?Generate .env with scripts/New-Environment.ps1}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required for the first startup}
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}
    volumes:
      - sql-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - ./deploy/init-db.sh:/init-db.sh:ro
    entrypoint: ["/bin/bash", "/init-db.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  sql-data:
