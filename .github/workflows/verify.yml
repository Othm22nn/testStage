name: Verify SkyTrace
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Ephemeral CI fixtures, never deployment credentials.
      ADMIN_PASSWORD: Test-admin-2026!
      DB_PASSWORD: Ci-database-2026!
      MSSQL_SA_PASSWORD: Ci-sqlserver-2026!
      JWT_SECRET: ci-signing-key-for-disposable-tests-only-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/pom.xml
      - name: Unit and API tests
        working-directory: app
        run: sh mvnw -B -ntp verify
      - name: Start Compose stack
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Install test browser
        working-directory: app
        run: sh mvnw -B -ntp -Pe2e test-compile exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.classpathScope=test '-Dexec.args=install --with-deps chromium'
      - name: E2E through Nginx and SQL Server
        working-directory: app
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: sh mvnw -B -ntp -Pe2e -Dbrowser.channel=chromium -Dtest=BrowserE2ETest test
      - name: Compose diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation
          path: |
            app/target/surefire-reports/
            app/target/e2e/
      - name: Stop disposable stack
        if: always()
        run: docker compose down -v
